name: Update Repo Count Badge

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get current public repo count
        id: repos
        run: |
          COUNT=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/users/jenniferestigene | jq '.public_repos')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Update badge number in README
        run: |
          sed -i -E "s|Repos-[0-9]+-181717|Repos-${{ steps.repos.outputs.count }}-181717|" README.md

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update repo count badge"
          file_pattern: README.md
